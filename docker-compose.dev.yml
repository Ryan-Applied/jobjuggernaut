services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jj
      POSTGRES_PASSWORD: jj
      POSTGRES_DB: jj
    ports: ["5440:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jj"]
      interval: 5s
      retries: 10
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"]
volumes:
  pgdata:
